# .github/workflows/unused-components.yml
name: Check Unused Vue Components

on:
  pull_request:
    paths:
      - 'resources/js/**'

jobs:
  check-unused:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find unused Vue components and pages
        run: |
          echo "🔍 Scanning for unused .vue files..."
          UNUSED=()

          while IFS= read -r file; do
            name=$(basename "$file" .vue)

            # Search all .vue and .ts files for references, excluding the file itself
            matches=$(grep -r "$name" resources/js \
              --include="*.vue" \
              --include="*.ts" \
              -l 2>/dev/null | grep -v "^$file$")

            if [ -z "$matches" ]; then
              UNUSED+=("$file")
            fi
          done < <(find resources/js/components resources/js/pages -name "*.vue")

          if [ ${#UNUSED[@]} -gt 0 ]; then
            echo ""
            echo "❌ Unused Vue files detected:"
            for f in "${UNUSED[@]}"; do
              echo "  - $f"
            done
            echo ""
            echo "Either use them or delete them before merging."
            exit 1
          else
            echo "✅ No unused Vue files found."
          fi